id: org.hdfgroup.HDFCompass
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: HDFCompass
rename-desktop-file: HDFCompass.desktop
finish-args:
  - --socket=x11
  - --device=all
  - --share=ipc
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
cleanup:
  - /include
  - /man
  - /share/aclocal
  - /share/bakefile
  - /share/hdf5_examples
  - '*.la'
  - '*.a'

modules:
  - shared-modules/python2.7/python-2.7.json

  - name: wxWidgets
    buildsystem: autotools
    build-options:
      cxxflags: -std=gnu++14
    config-opts:
      - --disable-monolithic
      - --disable-rpath
      - --enable-geometry
      - --enable-graphics_ctx
      - --enable-optimise
      - --enable-sound
      - --enable-display
      - --enable-unicode
      - --with-gtk=3
      - --with-python=/app/bin/python
      - --with-gnomeprint
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/wxwindows/3.0.2/wxWidgets-3.0.2.tar.bz2
        sha256: 346879dc554f3ab8d6da2704f651ecb504a22e9d31c17ef5449b129ed711585d
      - type: shell
        commands:
          - cp /usr/share/automake-*/config.{guess,sub} .

  - name: wxPython
    buildsystem: simple
    build-commands:
      - >-
        cd wxPython; /app/bin/python setup.py
        WXPORT=gtk3
        UNICODE=1
        BUILD_GLCANVAS=0
        EP_ADD_OPTS=1
        EP_FULL_VER=0
        NO_SCRIPTS=1
        WX_CONFIG="/app/bin/wx-config --prefix=/app --no_rpath"
        SYS_WX_CONFIG="wx-config --version=3.0.2.0 --toolkit=gtk3 --static=no"
        build_ext --rpath=/app/lib
        build
      - >-
        cd wxPython; /app/bin/python setup.py
        WXPORT=gtk3
        UNICODE=1
        BUILD_GLCANVAS=0
        EP_ADD_OPTS=1
        EP_FULL_VER=0
        NO_SCRIPTS=1
        WX_CONFIG="/app/bin/wx-config --prefix=/app --no_rpath"
        SYS_WX_CONFIG="wx-config --version=3.0.2.0 --toolkit=gtk3 --static=no --unicode"
        build_ext --rpath=/app/lib
        install
        --root=/
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/wxpython/wxPython/3.0.2.0/wxPython-src-3.0.2.0.tar.bz2
        sha256: d54129e5fbea4fb8091c87b2980760b72c22a386cb3b9dd2eebc928ef5e8df61

  - name: hdf5
    buildsystem: autotools
    config-opts:
      - --enable-cxx
    build-options:
      cflags: -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-implicit-function-declaration
    sources:
      - type: archive
        url: https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.8/hdf5-1.8.16/src/hdf5-1.8.16.tar.bz2
        sha256: 13aaae5ba10b70749ee1718816a4b4bfead897c2fcb72c24176e759aec4598c6
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} bin

  - python-modules.json

  - name: hdfcompass
    buildsystem: simple
    build-commands:
      - python2 setup.py install --prefix=/app --root=/
    post-install:
      - desktop-file-edit --set-icon=${FLATPAK_ID} HDFCompass.desktop
      - install -Dm0644 HDFCompass.desktop -t /app/share/applications/
      - install -Dm0644 ${FLATPAK_ID}.appdata.xml -t /app/share/metainfo/
      - install -Dm0644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
    sources:
      - type: git
        url: https://github.com/HDFGroup/hdf-compass.git
        tag: v0.6.0
      - type: file
        path: org.hdfgroup.HDFCompass.appdata.xml
      - type: file
        path: org.hdfgroup.HDFCompass.png
